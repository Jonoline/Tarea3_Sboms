version: '3.8'

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbom-pipeline:latest
    container_name: sbom-pipeline
    volumes:
      - ./pipeline/data:/app/data
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: python src/main.py
    restart: no
    env_file: .env

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: sbom-pipeline:latest
    container_name: sbom-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./pipeline/data:/app/data
      - ./analysis:/app/analysis
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: jupyter notebook --ip=0.0.0.0 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    restart: no
    env_file: .env

networks:
  sbom-net:
    driver: bridge